name: Compilation SXM Boot

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS (.dmg universel Intel + Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm install
      - run: npx tauri build --target universal-apple-darwin --bundles dmg
        working-directory: src-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: SXM-Boot-macOS
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  fedora:
    name: Fedora (.rpm)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libayatana-appindicator3-dev rpm
      - run: npm install
      - run: npx tauri build --bundles rpm
        working-directory: src-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: SXM-Boot-Fedora
          path: src-tauri/target/release/bundle/rpm/*.rpm
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/rpm/*.rpm
