name: Compilation SXM Boot

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS (.dmg universel Intel + Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm install
      - run: npx tauri build --target universal-apple-darwin --bundles dmg
        working-directory: src-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: SXM-Boot-macOS
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  fedora:
    name: Fedora (.rpm)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libayatana-appindicator3-dev rpm
      - run: npm install
      - run: npx tauri build --bundles rpm
        working-directory: src-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: SXM-Boot-Fedora
          path: src-tauri/target/release/bundle/rpm/*.rpm

  windows:
    name: Windows 10 / 11 (installateur .exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npx tauri build --bundles nsis
        working-directory: src-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: SXM-Boot-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe

  release:
    name: Publication sur la page Releases
    needs: [macos, fedora, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: SXM Boot ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Windows 10 / 11** : `SXM.Boot_${{ steps.v.outputs.version }}_x64-setup.exe`
            **macOS** : `SXM.Boot_${{ steps.v.outputs.version }}_universal.dmg`
            **Fedora** : `SXM.Boot-${{ steps.v.outputs.version }}-1.x86_64.rpm`
          files: dist/*
